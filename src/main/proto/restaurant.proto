syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.shubh.restaurant_service.grpc";
option java_outer_classname = "RestaurantProto";

package restaurant;

service RestaurantService {
  rpc CreateRestaurant(CreateRestaurantRequest) returns (RestaurantResponse);
  rpc UpdateRestaurant(UpdateRestaurantRequest) returns (RestaurantResponse);
  rpc GetRestaurant(GetRestaurantRequest) returns (RestaurantResponse);
  rpc ListRestaurants(ListRestaurantsRequest) returns (ListRestaurantsResponse);
  rpc DeleteRestaurant(DeleteRestaurantRequest) returns (DeleteRestaurantResponse);
}

message CreateRestaurantRequest {
  string name = 1;
  optional string address = 2;
  string contact_email = 3;
  optional string contact_number = 4;
  optional string cuisine_type = 5;
  bool async_mode = 6;
  string city = 7;
  optional double latitude = 8;
  optional double longitude = 9;
  optional double rating = 10;
  optional int32 total_reviews = 11;
  optional int32 price_range = 12;
  optional bool is_open = 13;
  optional string image_url = 14;
  optional string description = 15;
  optional string tags = 16;
}

message UpdateRestaurantRequest {
  string id = 1;
  optional string name = 2;
  optional string address = 3;
  optional string contact_email = 4;
  optional string contact_number = 5;
  optional string cuisine_type = 6;
  optional string city = 7;
  optional double latitude = 8;
  optional double longitude = 9;
  optional double rating = 10;
  optional int32 total_reviews = 11;
  optional int32 price_range = 12;
  optional bool is_open = 13;
  optional string image_url = 14;
  optional string description = 15;
  optional string tags = 16;
}

message GetRestaurantRequest {
  string id = 1;
}

message ListRestaurantsRequest {
  string city = 1;
  optional string cuisine_type = 2;
  int32 page_size = 3;
  optional string cursor = 4;
}

message DeleteRestaurantRequest {
  string id = 1;
}

message RestaurantResponse {
  bool success = 1;
  string message = 2;
  RestaurantData data = 3;
}

message ListRestaurantsResponse {
  bool success = 1;
  string message = 2;
  repeated RestaurantData restaurants = 3;
  int32 count = 4;
  optional string next_cursor = 5;
  bool has_more = 6;
}

message DeleteRestaurantResponse {
  bool success = 1;
  string message = 2;
}

message RestaurantData {
  string id = 1;
  optional string name = 2;
  optional string address = 3;
  optional string contact_email = 4;
  optional string contact_number = 5;
  optional string cuisine_type = 6;
  optional string created_at = 7;
  optional string updated_at = 8;
  optional string city = 9;
  optional double latitude = 10;
  optional double longitude = 11;
  optional double rating = 12;
  optional int32 total_reviews = 13;
  optional int32 price_range = 14;
  optional bool is_open = 15;
  optional string image_url = 16;
  optional string description = 17;
  optional string tags = 18;
  optional int64 version = 19;
}
