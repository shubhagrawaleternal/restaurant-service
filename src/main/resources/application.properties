
# Application Name
spring.application.name=restaurant-service

# Server Configuration
server.port=8081

# gRPC Server Configuration
grpc.server.port=9090

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootuser
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
cache.redis.list.ttl=1800000

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=restaurant-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Kafka Topics
kafka.topic.restaurant-events=restaurant-events
kafka.topic.restaurant-created=restaurant.created
kafka.topic.restaurant-create-async=restaurant.create.async
kafka.topic.restaurant-updated=restaurant.updated
kafka.topic.restaurant-deleted=restaurant.deleted

# Kafka Consumer Groups
kafka.consumer.group.created=restaurant-created-consumer-group
kafka.consumer.group.async-create=restaurant-async-create-consumer-group
kafka.consumer.group.updated=restaurant-updated-consumer-group
kafka.consumer.group.deleted=restaurant-deleted-consumer-group

# DynamoDB Configuration
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.region=us-east-1
aws.dynamodb.accessKey=dummy
aws.dynamodb.secretKey=dummy
aws.dynamodb.table.name=restaurants

# Resilience4j Circuit Breaker Configuration
# Higher thresholds to ensure rate limiting triggers before circuit breaker opens
resilience4j.circuitbreaker.instances.dynamodb.register-health-indicator=true
resilience4j.circuitbreaker.instances.dynamodb.sliding-window-size=50
resilience4j.circuitbreaker.instances.dynamodb.minimum-number-of-calls=30
resilience4j.circuitbreaker.instances.dynamodb.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.dynamodb.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.dynamodb.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.dynamodb.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.dynamodb.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.dynamodb.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.dynamodb.ignore-exceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted

# Resilience4j Rate Limiter Configuration (2 requests per 10 seconds)
resilience4j.ratelimiter.instances.restaurant-create.limit-for-period=2
resilience4j.ratelimiter.instances.restaurant-create.limit-refresh-period=10s
resilience4j.ratelimiter.instances.restaurant-create.timeout-duration=5s
resilience4j.ratelimiter.instances.restaurant-create.register-health-indicator=true

resilience4j.ratelimiter.instances.restaurant-update.limit-for-period=2
resilience4j.ratelimiter.instances.restaurant-update.limit-refresh-period=10s
resilience4j.ratelimiter.instances.restaurant-update.timeout-duration=5s
resilience4j.ratelimiter.instances.restaurant-update.register-health-indicator=true

resilience4j.ratelimiter.instances.restaurant-delete.limit-for-period=2
resilience4j.ratelimiter.instances.restaurant-delete.limit-refresh-period=10s
resilience4j.ratelimiter.instances.restaurant-delete.timeout-duration=5s
resilience4j.ratelimiter.instances.restaurant-delete.register-health-indicator=true

resilience4j.ratelimiter.instances.restaurant-get.limit-for-period=2
resilience4j.ratelimiter.instances.restaurant-get.limit-refresh-period=10s
resilience4j.ratelimiter.instances.restaurant-get.timeout-duration=5s
resilience4j.ratelimiter.instances.restaurant-get.register-health-indicator=true

resilience4j.ratelimiter.instances.restaurant-list.limit-for-period=2
resilience4j.ratelimiter.instances.restaurant-list.limit-refresh-period=10s
resilience4j.ratelimiter.instances.restaurant-list.timeout-duration=5s
resilience4j.ratelimiter.instances.restaurant-list.register-health-indicator=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.shubh.restaurant_service=DEBUG
logging.level.io.github.resilience4j=DEBUG
